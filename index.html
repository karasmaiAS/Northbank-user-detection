<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse the Northstar Bank customer list." />
    <meta name="theme-color" content="#f6f7f5" />
    <title>Customer list · Northstar Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M20 3.5 23.7 16.3 36.5 20l-12.8 3.7L20 36.5l-3.7-12.8L3.5 20l12.8-3.7L20 3.5Z" fill="currentColor" />
            <circle cx="20" cy="20" r="3.2" fill="#142720" />
          </svg>
        </span>
        <span class="brand-name">Northstar Bank User List Security Alert Detection</span>
      </header>

      <section class="customer-list" aria-labelledby="page-title">
        <div class="page-heading">
          <div>
            <h1 id="page-title">Customer <span>list detection</span></h1>
          </div>
        </div>

        <section class="directory-card" aria-labelledby="directory-title">
          <div class="directory-heading">
            <div class="directory-title-line">
              <span class="directory-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M8 5h10a2 2 0 0 1 2 2v12H8a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" />
                  <path d="M6 8H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12M10 10h6m-6 4h6" />
                </svg>
              </span>
              <h2 id="directory-title">All customers detected</h2>
            </div>
            <div class="table-actions">
              <label class="sort-filter">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 7h16M7 12h10m-7 5h4" />
                </svg>
                <span class="visually-hidden">Sort customers</span>
                <select id="sort-filter">
                  <option value="name-asc">Name: A to Z</option>
                  <option value="name-desc">Name: Z to A</option>
                  <option value="age-asc">Age: Youngest first</option>
                  <option value="age-desc">Age: Oldest first</option>
                </select>
              </label>
              <label class="country-filter">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 7h16M7 12h10m-7 5h4" />
                </svg>
                <span class="visually-hidden">Filter by country</span>
                <select id="country-filter">
                  <option value="">All countries</option>
                </select>
              </label>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">CUSTOMER</th>
                  <th scope="col">AGE</th>
                  <th scope="col">MEMBER FOR</th>
                  <th scope="col">COUNTRY</th>
                  <th scope="col">CURRENT WORK</th>
                  <th scope="col">MOBILE NUMBER</th>
                  <th scope="col">EMAIL ADDRESS</th>
                  <th scope="col">SECURITY ALERTS</th>
                </tr>
              </thead>
              <tbody id="customer-rows"></tbody>
            </table>
            <div class="empty-state" id="empty-state" hidden>
              <span class="empty-icon" aria-hidden="true">⌕</span>
              <strong>No customers found</strong>
              <span>There are no customers for this country yet.</span>
              <button id="clear-filters" type="button">Clear filters</button>
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
